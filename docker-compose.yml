version: '3.8'

services:
  # 1. Next.js SaaS Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pixelkit-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-pixelkit_dev_secret_key_minimum_32_characters_long_for_security_testing}
      - BETTER_AUTH_URL=http://localhost:3000
      - DATABASE_URL=${DATABASE_URL}
      - RESEND_API_KEY=${RESEND_API_KEY}
    depends_on:
      - backend-api

  # 2. Python FastAPI Stateless API Server
  backend-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pixelkit-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --workers 4
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-pixelkit_dev_secret_key_minimum_32_characters_long_for_security_testing}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-pixelkit-production-storage}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 3. Celery Background Worker (Asynchronous Document & OCR Pipeline)
  celery-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pixelkit-celery-worker
    restart: unless-stopped
    command: celery -A backend.app.workers.celery_app.celery_app worker --loglevel=info --concurrency=4 -Q pdf_queue,image_queue,ocr_queue
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-pixelkit-production-storage}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      - redis

  # 4. Redis Message Broker & Cache
  redis:
    image: redis:7-alpine
    container_name: pixelkit-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
